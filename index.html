<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ff6d91">
  <meta name="description" content="使用可爱角色图片合成升级的休闲小游戏——合成宁宁酱">
  <title>合成宁宁酱</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><span class="eyebrow">SCORE</span><strong id="score">0</strong></div>
      <h1>合成宁宁酱</h1>
      <div class="best"><span class="eyebrow">BEST</span><strong id="best">0</strong></div>
    </header>
    <section class="nextbar" aria-label="下一个角色">
      <span>下一个</span><img id="nextPiece" src="./res/raw-assets/ad/ad16ccdc-975e-4393-ae7b-8ac79c3795f2.png" alt="下一个角色">
      <button id="soundBtn" class="icon-btn" type="button" aria-label="关闭声音">♪</button>
    </section>
    <section class="game-shell">
      <canvas id="game" aria-label="合成小游戏区域"></canvas>
      <div class="danger-line"><span>警戒线</span></div>
      <div id="guide" class="guide">左右移动，松手投放</div>
      <div id="overlay" class="overlay hidden">
        <div class="dialog">
          <span class="eyebrow">GAME OVER</span>
          <h2>本局得分 <b id="finalScore">0</b></h2>
          <button id="restartBtn" type="button">再来一局</button>
        </div>
      </div>
    </section>
    <button id="resetBtn" class="reset" type="button">重新开始</button>
  </main>
  <script src="./game.js"></script>
</body>
</html>
